settings:
  min-password-length: 6
  max-password-length: 32
  max-attempts: 5
  lockout-seconds: 300

  session:
    enabled: true
    # Ayni IP'den bu sure icinde tekrar girerse sifre sormaz (saat)
    hours: 24

  animation:
    enabled: true
    # Kac tick'te bir animasyon yenilensin (20 tick = 1 saniye)
    speed-ticks: 3
    register-title: "REGISTER"
    login-title: "LOGIN"
    register-subtitle: "&7/register <sifre> <sifre>"
    login-subtitle: "&7/login <sifre>"

messages:
  prefix: "&8[&bBladeX&8] &r"
  register-prompt: "&eHesabin yok! &f/register <sifre> <sifre> &7yazarak kayit ol."
  login-prompt: "&eGiris yapmalisin! &f/login <sifre> &7yaz."
  register-success: "&aKayit basarili, giris yaptin!"
  login-success: "&aGiris basarili!"
  auto-login: "&aOturumun acik oldugu icin otomatik giris yapildi."
  already-logged: "&cZaten giris yaptin."
  already-registered: "&cBu hesap zaten kayitli. &f/login <sifre> &cyaz."
  not-registered: "&cHesabin yok. &f/register <sifre> <sifre> &cyaz."
  usage-register: "&cKullanim: &f/register <sifre> <sifre>"
  usage-login: "&cKullanim: &f/login <sifre>"
  mismatch: "&cGirdigin sifreler ayni degil."
  short-password: "&cSifre en az &f{min} &ckarakter olmali."
  long-password: "&cSifre en fazla &f{max} &ckarakter olabilir."
  wrong-password: "&cYanlis sifre! Kalan deneme hakkin: &f{left}"
  locked: "&cCok fazla yanlis deneme. &f{sec} &csaniye bekle."
  must-login: "&cOnce giris yapmalisin!"
  error: "&cBir hata olustu, lutfen tekrar dene."
